<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AppCleaner</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="titlebar">
    <span class="titlebar-title">AppCleaner</span>
    <div class="titlebar-actions">
      <button id="chooseBtn" class="icon-btn" title="Choose an application…">⬇</button>
      <button id="listToggleBtn" class="icon-btn" title="Show installed applications">☰</button>
    </div>
  </div>

  <!-- DROP VIEW -->
  <div id="dropView" class="view drop-view">
    <div id="dropZone" class="drop-zone">
      <div class="drop-zone-icon">📦</div>
      <div class="drop-zone-title">Drop your apps here</div>
      <div class="drop-zone-sub" id="dropStatus">or click below to choose an application</div>
      <button id="dropChooseBtn" class="btn btn-secondary">Choose Application…</button>
    </div>
  </div>

  <!-- LIST VIEW -->
  <div id="listView" class="view list-view hidden">
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">Applications <span class="chevron">⌄</span></div>
        <div class="sidebar-subtitle" id="sidebarSubtitle">Select an item to view its related files.</div>
      </div>
      <div class="search-pill">
        <span class="search-icon">🔍</span>
        <input id="searchInput" type="text" placeholder="Search" autocomplete="off">
      </div>
      <div class="section-header">USER APPLICATIONS</div>
      <div id="appList" class="app-list"></div>
      <div class="sidebar-status" id="sidebarStatus"></div>
    </div>

    <div class="detail">
      <div class="detail-header">
        <div class="detail-name" id="detailName">No application selected</div>
        <div class="detail-sub" id="detailSub">Choose an app to scan for leftover files.</div>
        <div class="detail-warning" id="detailWarning"></div>
      </div>

      <div class="results-toolbar">
        <div class="results-summary" id="resultsSummary"></div>
        <div class="results-actions">
          <button id="selectAllBtn" class="btn btn-small">Select All</button>
          <button id="deselectAllBtn" class="btn btn-small">Deselect All</button>
        </div>
      </div>

      <div class="results-list" id="resultsList"></div>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
    <div class="footer-row">
      <div class="status-text" id="statusText">Ready.</div>
      <div class="footer-actions">
        <button id="cancelBtn" class="btn btn-small" disabled>Cancel</button>
        <button id="scanBtn" class="btn btn-small" disabled>Scan</button>
        <button id="removeBtn" class="btn btn-small btn-danger" disabled>Remove Selected…</button>
      </div>
    </div>
  </div>

  <!-- Lightweight modal used for confirmations instead of native dialogs
       (keeps everything inside the same small, borderless webview window). -->
  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
